<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقويم المهام والفعاليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#3D2154;
  --ink:#1c1c1c;
  --muted:#a9a9a9;
  --line:#d8d8d8;
  --soft:#f6f5f7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 60px}

/* ===== تبديل التقويمين ===== */
.tabs{display:flex;gap:0;margin-bottom:20px;border:1.5px solid var(--line);width:fit-content}
.tabs button{
  padding:11px 30px;border:none;background:#fff;font-family:inherit;font-size:15px;font-weight:700;
  color:#777;cursor:pointer;transition:.15s;position:relative
}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button:not(.on):hover{background:var(--soft);color:var(--ink)}

/* ===== الهيدر ===== */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.month-block{background:var(--accent);color:#fff;padding:14px 44px 18px;min-width:min(66%,660px);text-align:center;order:2;margin-right:auto;transition:background .2s}
.month-block h1{margin:0;font-size:clamp(28px,5vw,50px);font-weight:800;letter-spacing:1px;line-height:1.25}
.month-block .yr{display:block;font-size:15px;font-weight:500;opacity:.75;letter-spacing:2px}
.nav{display:flex;gap:8px;order:1}
.nav button{width:42px;height:42px;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--accent);font-family:inherit;transition:.15s}
.nav button:hover{border-color:var(--accent);background:var(--soft)}
.nav .today-btn{width:auto;padding:0 16px;font-size:14px;font-weight:700}
button:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== الشبكة ===== */
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.weekdays{margin-bottom:8px}
.weekdays div{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.day{position:relative;aspect-ratio:4/5;border:1.5px solid var(--line);background:#fff;padding:8px 8px 6px;font-family:inherit;text-align:right;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s,background .15s}
.day.blank{border:none;background:none;pointer-events:none}
.day:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.day.over{background:var(--soft);border-color:var(--accent);border-style:dashed}
.day .num{font-size:13px;font-weight:700;color:var(--muted);line-height:1}
.day.has .num{color:var(--ink)}
.day.today .num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;margin-right:auto;font-size:12px}
.stripe{position:absolute;top:0;right:0;left:0;height:5px;display:flex}
.stripe span{flex:1}
.titles{margin-top:auto;display:flex;flex-direction:column;gap:3px;text-align:center;padding-bottom:2px}
.titles p{margin:0;font-size:11.5px;font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:grab}
.titles p.dragging{opacity:.35}
.titles p.done{text-decoration:line-through;opacity:.45}
.titles .more{font-size:10.5px;font-weight:500;color:var(--muted);cursor:pointer}

/* ===== إحصائية الشهر ===== */
.stats{margin-top:34px;border:1.5px solid var(--line);padding:18px 20px}
.stats-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.stats-head h3{margin:0;font-size:15px;font-weight:800}
.stats-head .pct{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.stats-head .pct small{font-size:12.5px;font-weight:500;color:#777;margin-right:8px}
.bar{height:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.bar.total{height:12px;margin-bottom:20px}
.srow{display:grid;grid-template-columns:110px 1fr 62px;align-items:center;gap:12px;margin-bottom:11px;font-size:13px}
.srow .nm{display:flex;align-items:center;gap:7px;font-weight:700}
.srow .nm i{width:11px;height:11px;flex-shrink:0}
.srow .cnt{text-align:left;font-size:12.5px;color:#666;font-weight:700;font-variant-numeric:tabular-nums}
.stats .none{color:var(--muted);font-size:13.5px;text-align:center;padding:6px 0}

/* ===== المفتاح والأزرار ===== */
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin-top:28px;padding-top:20px;border-top:1.5px solid var(--line)}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.legend i{width:22px;height:22px;display:block}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px;line-height:2}
.hint button{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0 5px}
.ro-badge{display:none;background:#f0ecf3;color:var(--accent);text-align:center;padding:9px;font-size:13px;font-weight:700;margin-bottom:18px;border:1.5px solid var(--accent)}
body.readonly .ro-badge{display:block}
body.readonly .hint .own,body.readonly form,body.readonly .task input[type=checkbox]{display:none!important}
.acts button.mail{color:#1F5F5B}

/* ===== النافذة ===== */
.overlay{position:fixed;inset:0;background:rgba(20,12,28,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto}
.sheet header{background:var(--accent);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.sheet header h2{margin:0;font-size:19px;font-weight:800}
.sheet header span{display:block;font-size:12px;opacity:.75;font-weight:500}
.sheet header button{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1;font-family:inherit}
.body{padding:18px 20px 22px}
.task{border:1.5px solid var(--line);border-right-width:6px;padding:11px 13px;margin-bottom:10px}
.task .t-top{display:flex;align-items:flex-start;gap:10px}
.task h3{margin:0;font-size:15.5px;font-weight:700;line-height:1.4}
.task.done h3{text-decoration:line-through;opacity:.5}
.task .meta{font-size:12px;color:#777;margin:5px 0 0;font-weight:500}
.task .notes{font-size:13.5px;margin:8px 0 0;line-height:1.7;white-space:pre-wrap;color:#333}
.task .acts{display:flex;gap:14px;margin-top:9px}
.task .acts button{background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--accent);cursor:pointer}
.task .acts button.del{color:#8E2B2B}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;cursor:pointer;flex-shrink:0}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0 20px}
form{border-top:1.5px solid var(--line);padding-top:16px;margin-top:6px}
form h4{margin:0 0 12px;font-size:14px;font-weight:800}
label{display:block;font-size:12.5px;font-weight:700;margin:0 0 5px;color:#555}
input[type=text],input[type=time],input[type=date],textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);font-family:inherit;font-size:14px;background:#fff;color:var(--ink);border-radius:0}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.6}
.row{display:flex;gap:10px;margin-bottom:12px}
.row>div{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:#fff;padding:6px 12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:11px;height:11px;display:block}
.actions{display:flex;gap:10px}
.btn{flex:1;padding:12px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:#555;border:1.5px solid var(--line);flex:0 0 100px}

@media(max-width:640px){
  .wrap{padding:14px 10px 40px}
  .weekdays,.grid{gap:5px}
  .day{aspect-ratio:1/1.1;padding:5px 4px}
  .titles p{font-size:9px;-webkit-line-clamp:1}
  .titles .more{display:none}
  .weekdays div{font-size:10px}
  .month-block{padding:10px 16px 12px;min-width:0}
  .tabs button{padding:10px 20px;font-size:14px}
  .srow{grid-template-columns:88px 1fr 54px;gap:8px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="ro-badge">نسخة للعرض فقط — تقدر تتصفح وتضغط على أي يوم تشوف التفاصيل، بس التعديل مقفول.</div>

  <div class="tabs" id="tabs"></div>

  <div class="topbar">
    <div class="nav">
      <button id="prev" title="الشهر السابق">›</button>
      <button class="today-btn" id="todayBtn">اليوم</button>
      <button id="next" title="الشهر التالي">‹</button>
    </div>
    <div class="month-block">
      <h1 id="mName">يناير</h1>
      <span class="yr" id="mYear">2026</span>
    </div>
  </div>

  <div class="weekdays" id="weekdays"></div>
  <div class="grid" id="grid"></div>

  <section class="stats">
    <div class="stats-head">
      <h3 id="statTitle">إنجاز الشهر</h3>
      <div class="pct"><small id="statCount"></small><span id="statPct">0%</span></div>
    </div>
    <div class="bar total"><i id="statBar" style="width:0"></i></div>
    <div id="statRows"></div>
  </section>

  <div class="legend" id="legend"></div>
  <p class="hint">
    اضغط على أي يوم تشوف التفاصيل.<span class="own"> واسحب عنوان المهمة من يوم لأي يوم ثاني عشان تنقلها.<br>
    <button id="shareBtn">تصدير نسخة للمشاركة</button>·<button id="exportBtn">حفظ نسخة احتياطية</button>·<button id="importBtn">استرجاع نسخة</button>
    <input type="file" id="importFile" accept=".json" hidden></span>
  </p>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <header>
      <div><h2 id="dTitle"></h2><span id="dSub"></span></div>
      <button id="close" aria-label="إغلاق">×</button>
    </header>
    <div class="body">
      <div id="taskList"></div>
      <form id="form">
        <h4 id="formTitle">إضافة جديدة</h4>
        <label for="tTitle">العنوان</label>
        <input type="text" id="tTitle" autocomplete="off" required>
        <label style="margin-top:12px">النوع</label>
        <div class="chips" id="chips"></div>
        <div class="row">
          <div><label for="tDate">التاريخ</label><input type="date" id="tDate"></div>
          <div><label for="tTime">الوقت (اختياري)</label><input type="time" id="tTime"></div>
        </div>
        <label for="tNotes">التفاصيل</label>
        <textarea id="tNotes" placeholder="اكتب هني التفاصيل..."></textarea>
        <label for="tTo" style="margin-top:12px">بريد المستلمين (اختياري — حط كم إيميل تبيه، افصلهم بفاصلة ",")</label>
        <textarea id="tTo" placeholder="ali@email.com, sara@email.com, ..." style="min-height:44px"></textarea>
        <div class="actions" style="margin-top:14px">
          <button type="submit" class="btn" id="saveBtn">إضافة</button>
          <button type="button" class="btn ghost" id="cancelEdit" style="display:none">إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   التقويمان وأنواعهما — عدّل الأسماء والألوان من هني وبس
   ========================================================== */
const BOARDS = {
  tasks: {
    label:'المهام', word:'مهمة', accent:'#3D2154',
    types:[
      { id:'work',     name:'شغل',       color:'#8E2B2B' },
      { id:'acc',      name:'محاسبة',     color:'#E3B23C' },
      { id:'meet',     name:'اجتماعات',   color:'#2E7D7D' },
      { id:'deadline', name:'موعد نهائي', color:'#C2601F' },
      { id:'personal', name:'شخصي',      color:'#3D2154' }
    ]
  },
  events: {
    label:'الفعاليات', word:'فعالية', accent:'#1F5F5B',
    types:[
      { id:'event',    name:'إيميل تعليمي',      color:'#1F5F5B' },
      { id:'campaign', name:'إيميل تشجيعي',        color:'#C2601F' },
      { id:'shoot',    name:'فعاليات ومسابقات',       color:'#7A3E8F' },
      { id:'delivery', name:'مبادرات اسعاد الموظفين',  color:'#8E2B2B' }
    ]
  }
};

const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS   = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const KEY = 'my-calendar-v2', OLDKEY = 'my-calendar-tasks';

/* ---------- الاتصال بـ Supabase (تخزين مشترك بين كل الأجهزة) ---------- */
const SUPABASE_URL = 'https://dwjcukzxtqcofbbkzoax.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3amN1a3p4dHFjb2ZiYmt6b2F4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDYxNDIsImV4cCI6MjEwMTgyMjE0Mn0.oDDlaZ2jWWSNXJcboxGrKEZFsEVbUXz9z8jc_0Aa1-U';
const sbClient = (window.supabase && SUPABASE_URL)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let pendingDeletes = new Set();

let data = { tasks:{}, events:{} };
let board = 'tasks';
let view = new Date();
let openDate = null, editingId = null, pickedType = null;
let READONLY = false;

const B = () => BOARDS[board];
const D = () => data[board];
const typeOf = id => B().types.find(t=>t.id===id) || B().types[0];
const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey = key(new Date());
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- التخزين (Supabase + نسخة محلية احتياطية) ---------- */
const sortByTime = arr => arr.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

const store = {
  async load(){
    if(sbClient){
      try{
        const { data: rows, error } = await sbClient.from('calendar_items').select('*');
        if(error) throw error;
        const out = { tasks:{}, events:{} };
        (rows||[]).forEach(r=>{
          const b = (r.board === 'events') ? 'events' : 'tasks';
          const k = r.item_date;
          (out[b][k] = out[b][k] || []).push({
            id:r.id, title:r.title, type:r.type,
            time:r.item_time||'', notes:r.notes||'', to:r.mail_to||'', done:!!r.done
          });
        });
        Object.keys(out).forEach(b=> Object.keys(out[b]).forEach(k=> sortByTime(out[b][k])));
        try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){}
        return out;
      }catch(e){ console.warn('تعذّر الاتصال بقاعدة البيانات، جاري استخدام آخر نسخة محفوظة بالجهاز', e); }
    }
    let raw = null;
    try{ raw = localStorage.getItem(KEY); }catch(e){}
    if(raw){ try{ const o = JSON.parse(raw); return { tasks:o.tasks||{}, events:o.events||{} }; }catch(e){} }
    try{ const old = localStorage.getItem(OLDKEY); if(old) return { tasks:JSON.parse(old), events:{} }; }catch(e){}
    return { tasks:{}, events:{} };
  },
  async save(obj){
    if(READONLY) return;
    try{ localStorage.setItem(KEY, JSON.stringify(obj)); }catch(e){}
    if(!sbClient) return;
    try{
      const rows = [];
      Object.keys(obj).forEach(b=> Object.keys(obj[b]).forEach(k=>
        obj[b][k].forEach(t=> rows.push({
          id:t.id, board:b, item_date:k, title:t.title, type:t.type,
          item_time:t.time||null, notes:t.notes||null, mail_to:t.to||null, done:!!t.done
        }))
      ));
      if(rows.length) await sbClient.from('calendar_items').upsert(rows, { onConflict:'id' });
      if(pendingDeletes.size){
        const ids = [...pendingDeletes]; pendingDeletes.clear();
        await sbClient.from('calendar_items').delete().in('id', ids);
      }
    }catch(e){ console.warn('تعذّر حفظ التغيير بقاعدة البيانات المشتركة', e); }
  }
};

function subscribeRealtime(){
  if(!sbClient) return;
  sbClient.channel('calendar_items-sync')
    .on('postgres_changes', { event:'*', schema:'public', table:'calendar_items' }, async ()=>{
      data = await store.load();
      render();
      if(document.getElementById('overlay').classList.contains('open')) drawTasks();
    })
    .subscribe();
}

/* ---------- التبويبات ---------- */
function drawTabs(){
  document.getElementById('tabs').innerHTML = Object.keys(BOARDS)
    .map(b=>`<button data-b="${b}" class="${b===board?'on':''}">${BOARDS[b].label}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(el=> el.onclick = ()=>{
    board = el.dataset.b;
    document.documentElement.style.setProperty('--accent', B().accent);
    pickedType = B().types[0].id;
    drawTabs(); render();
  });
}

/* ---------- التقويم ---------- */
function render(){
  document.documentElement.style.setProperty('--accent', B().accent);
  document.getElementById('mName').textContent = MONTHS[view.getMonth()];
  document.getElementById('mYear').textContent = view.getFullYear();
  document.getElementById('weekdays').innerHTML = DAYS.map(d=>`<div>${d}</div>`).join('');

  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const total = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  let html = '';
  for(let i=0;i<first.getDay();i++) html += '<div class="day blank"></div>';

  for(let d=1; d<=total; d++){
    const k = `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const list = D()[k] || [];
    const colors = [...new Set(list.map(t=>typeOf(t.type).color))];
    const stripe = colors.length ? `<div class="stripe">${colors.map(c=>`<span style="background:${c}"></span>`).join('')}</div>` : '';
    const border = colors.length===1 ? `border-color:${colors[0]}` : (colors.length>1 ? 'border-color:#5a5a5a' : '');
    const titles = list.slice(0,2).map(t=>
      `<p class="${t.done?'done':''}" ${READONLY?'':'draggable="true"'} data-id="${t.id}" data-from="${k}">${esc(t.title)}</p>`).join('')
      + (list.length>2 ? `<p class="more">+${list.length-2} غيرها</p>` : '');
    html += `<button class="day ${list.length?'has':''} ${k===todayKey?'today':''}" data-k="${k}" style="${border}">
      ${stripe}<div class="num">${d}</div><div class="titles">${titles}</div></button>`;
  }
  document.getElementById('grid').innerHTML = html;
  wireGrid();
  drawStats();
  document.getElementById('legend').innerHTML = B().types.map(t=>`<div><i style="background:${t.color}"></i>${t.name}</div>`).join('');
}

/* ---------- السحب والإفلات ---------- */
let dragInfo = null;
function wireGrid(){
  document.querySelectorAll('.day[data-k]').forEach(cell=>{
    cell.onclick = ()=> openDay(cell.dataset.k);
    if(READONLY) return;
    cell.addEventListener('dragover', e=>{ if(dragInfo){ e.preventDefault(); cell.classList.add('over'); } });
    cell.addEventListener('dragleave', ()=> cell.classList.remove('over'));
    cell.addEventListener('drop', e=>{
      e.preventDefault(); cell.classList.remove('over');
      if(!dragInfo) return;
      moveTask(dragInfo.from, dragInfo.id, cell.dataset.k);
      dragInfo = null;
    });
  });
  if(READONLY) return;
  document.querySelectorAll('.titles p[data-id]').forEach(p=>{
    p.addEventListener('dragstart', e=>{
      e.stopPropagation();
      dragInfo = { from:p.dataset.from, id:p.dataset.id };
      p.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', p.dataset.id); }catch(err){}
    });
    p.addEventListener('dragend', ()=>{ p.classList.remove('dragging'); dragInfo = null; });
  });
}

function moveTask(from, id, to){
  if(from===to) return;
  const src = D()[from]; if(!src) return;
  const i = src.findIndex(t=>t.id===id); if(i<0) return;
  const [t] = src.splice(i,1);
  if(!src.length) delete D()[from];
  (D()[to] = D()[to] || []).push(t);
  sortDay(to);
  persist();
}
const sortDay = k => D()[k] && D()[k].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

/* ---------- إحصائية الشهر ---------- */
function drawStats(){
  const pre = `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}-`;
  const items = Object.keys(D()).filter(k=>k.startsWith(pre)).flatMap(k=>D()[k]);
  document.getElementById('statTitle').textContent = `إنجاز ${MONTHS[view.getMonth()]}`;
  const done = items.filter(t=>t.done).length;
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('statCount').textContent = items.length ? `${done} من ${items.length} ${B().word==='مهمة'?'مهمة':'فعالية'}` : '';
  document.getElementById('statBar').style.width = pct + '%';

  const rows = B().types.map(ty=>{
    const l = items.filter(t=>t.type===ty.id);
    if(!l.length) return '';
    const dn = l.filter(t=>t.done).length;
    const p = Math.round(dn/l.length*100);
    return `<div class="srow">
      <div class="nm"><i style="background:${ty.color}"></i>${ty.name}</div>
      <div class="bar"><i style="width:${p}%;background:${ty.color}"></i></div>
      <div class="cnt">${dn} / ${l.length}</div>
    </div>`;
  }).join('');
  document.getElementById('statRows').innerHTML = rows || '<p class="none">ما في شي مسجّل بهالشهر بعد.</p>';
}

/* ---------- نافذة اليوم ---------- */
function openDay(k){
  openDate = k;
  const [y,m,d] = k.split('-').map(Number);
  document.getElementById('dTitle').textContent = `${d} ${MONTHS[m-1]} ${y}`;
  document.getElementById('dSub').textContent = DAYS[new Date(y,m-1,d).getDay()] + ' · ' + B().label;
  resetForm();
  drawTasks();
  document.getElementById('overlay').classList.add('open');
}

function drawTasks(){
  const list = D()[openDate] || [];
  const box = document.getElementById('taskList');
  if(!list.length){
    box.innerHTML = `<p class="empty">${READONLY?'ما في شي مسجّل بهاليوم.':'ما في شي بهاليوم — ضيف تحت.'}</p>`;
    return;
  }
  box.innerHTML = list.map(t=>{
    const ty = typeOf(t.type);
    return `<div class="task ${t.done?'done':''}" style="border-right-color:${ty.color}">
      <div class="t-top">
        <input type="checkbox" data-done="${t.id}" ${t.done?'checked':''} title="خلصت">
        <div style="flex:1">
          <h3>${esc(t.title)}</h3>
          <p class="meta">${ty.name}${t.time?' · '+t.time:''}${t.done?' · تم':''}</p>
          ${t.notes?`<p class="notes">${esc(t.notes)}</p>`:''}
          <div class="acts">
            ${t.to?`<button class="mail" data-mail="${t.id}">✉ طرّش الإيميل${(()=>{const n=String(t.to).split(/[,;\n]+/).filter(s=>s.trim()).length; return n>1?` (${n})`:'';})()}</button>`:''}
            ${READONLY?'':`<button data-edit="${t.id}">تعديل / نقل</button><button class="del" data-del="${t.id}">حذف</button>`}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('[data-mail]').forEach(el=> el.onclick = ()=>{
    const t = D()[openDate].find(x=>x.id===el.dataset.mail);
    const list = String(t.to||'').split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
    const to = encodeURIComponent(list.join(','));
    const subject = encodeURIComponent(t.title);
    const body = encodeURIComponent(t.notes || '');
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body}`, '_blank');
  });
  if(READONLY) return;

  box.querySelectorAll('[data-done]').forEach(el=> el.onchange = ()=>{
    D()[openDate].find(x=>x.id===el.dataset.done).done = el.checked; persist();
  });
  box.querySelectorAll('[data-del]').forEach(el=> el.onclick = ()=>{
    pendingDeletes.add(el.dataset.del);
    D()[openDate] = D()[openDate].filter(x=>x.id!==el.dataset.del);
    if(!D()[openDate].length) delete D()[openDate];
    resetForm(); persist();
  });
  box.querySelectorAll('[data-edit]').forEach(el=> el.onclick = ()=>{
    const t = D()[openDate].find(x=>x.id===el.dataset.edit);
    editingId = t.id;
    tTitle.value = t.title; tTime.value = t.time||''; tNotes.value = t.notes||''; tDate.value = openDate; tTo.value = t.to||'';
    pickedType = t.type; drawChips();
    document.getElementById('formTitle').textContent = 'تعديل';
    document.getElementById('saveBtn').textContent = 'حفظ';
    document.getElementById('cancelEdit').style.display = 'block';
    tTitle.focus();
  });
}

function drawChips(){
  document.getElementById('chips').innerHTML = B().types.map(t=>{
    const on = t.id===pickedType;
    return `<button type="button" class="chip ${on?'on':''}" data-t="${t.id}"
      style="${on?`background:${t.color};border-color:${t.color};color:#fff`:''}">
      <i style="background:${on?'#fff':t.color}"></i>${t.name}</button>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(c=> c.onclick = ()=>{ pickedType = c.dataset.t; drawChips(); });
}

function resetForm(){
  editingId = null;
  document.getElementById('form').reset();
  document.getElementById('tDate').value = openDate || '';
  pickedType = B().types[0].id; drawChips();
  document.getElementById('formTitle').textContent = 'إضافة جديدة';
  document.getElementById('saveBtn').textContent = 'إضافة';
  document.getElementById('cancelEdit').style.display = 'none';
}

async function persist(){ await store.save(data); render(); drawTasks(); }

/* ---------- الأحداث ---------- */
document.getElementById('form').onsubmit = e=>{
  e.preventDefault();
  const title = tTitle.value.trim(); if(!title) return;
  const target = tDate.value || openDate;
  if(editingId){
    const i = D()[openDate].findIndex(x=>x.id===editingId);
    const [t] = D()[openDate].splice(i,1);
    if(!D()[openDate].length) delete D()[openDate];
    Object.assign(t,{title,type:pickedType,time:tTime.value,notes:tNotes.value.trim(),to:tTo.value.trim()});
    (D()[target] = D()[target] || []).push(t);
  }else{
    (D()[target] = D()[target] || []).push({id:String(Date.now()),title,type:pickedType,time:tTime.value,notes:tNotes.value.trim(),to:tTo.value.trim(),done:false});
  }
  sortDay(target);
  if(target!==openDate) openDate = target, openDay(target);
  resetForm(); persist();
};
document.getElementById('cancelEdit').onclick = resetForm;
document.getElementById('close').onclick = ()=> overlay.classList.remove('open');
document.getElementById('overlay').onclick = e=>{ if(e.target.id==='overlay') e.currentTarget.classList.remove('open'); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') overlay.classList.remove('open'); });
document.getElementById('prev').onclick = ()=>{ view.setMonth(view.getMonth()-1); render(); };
document.getElementById('next').onclick = ()=>{ view.setMonth(view.getMonth()+1); render(); };
document.getElementById('todayBtn').onclick = ()=>{ view = new Date(); render(); };

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click();
}
document.getElementById('exportBtn').onclick = ()=> download('calendar-backup.json', JSON.stringify(data,null,2), 'application/json');
document.getElementById('importBtn').onclick = ()=> importFile.click();
document.getElementById('importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ const o = JSON.parse(r.result); data = {tasks:o.tasks||o||{}, events:o.events||{}}; persist(); }
    catch(err){ alert('الملف مو صالح — اختر ملف النسخة الاحتياطية.'); } };
  r.readAsText(f);
};
/* نسخة للمشاركة: ملف واحد فيه البيانات، للعرض فقط */
document.getElementById('shareBtn').onclick = ()=>{
  overlay.classList.remove('open');
  const seed = `<script>window.__SEED__=${JSON.stringify(data).replace(/</g,'\\u003c')};window.__READONLY__=true;<\/script>`;
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML.replace('<head>', '<head>\n'+seed);
  download('calendar-view.html', html, 'text/html');
};

/* ---------- تشغيل ---------- */
(async ()=>{
  if(window.__SEED__){ data = window.__SEED__; READONLY = !!window.__READONLY__; document.body.classList.add('readonly'); }
  else{ data = await store.load(); subscribeRealtime(); }
  pickedType = B().types[0].id;
  drawTabs(); drawChips(); render();
})();
</script>
</body>
